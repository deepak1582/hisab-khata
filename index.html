<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16233B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hisab Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a bahi-khata ledger — ink-blue cover band on top, paper-white pages below, red = paisa diya, green = paisa mila; bottom tab bar for one-thumb use on phones. */
:root{
  --paper:#F3F1EC; --card:#FFFFFF; --ink:#18212F; --muted:#666C78; --line:#E2DED5;
  --accent:#2448C8; --accent-ink:#FFFFFF; --gold:#E39B12;
  --cover:#16233B; --cover-ink:#F3F1EC; --cover-muted:#A9B4C8;
  --good:#11744A; --good-bg:#E2F2E9; --bad:#BE3227; --bad-bg:#FBE6E3;
  --shadow:0 1px 2px rgba(24,33,47,.06),0 4px 14px rgba(24,33,47,.06);
  --display:"Baloo 2",system-ui,sans-serif; --body:"Hind",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E131B; --card:#171E29; --ink:#E8ECF2; --muted:#98A1B0; --line:#273141;
    --accent:#7D9BFF; --accent-ink:#0E131B; --gold:#F2B33D;
    --cover:#1A2638; --cover-ink:#EEF1F6; --cover-muted:#93A0B6;
    --good:#4CC489; --good-bg:#11301F; --bad:#FF7B6C; --bad-bg:#3A1A17;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E131B; --card:#171E29; --ink:#E8ECF2; --muted:#98A1B0; --line:#273141;
  --accent:#7D9BFF; --accent-ink:#0E131B; --gold:#F2B33D;
  --cover:#1A2638; --cover-ink:#EEF1F6; --cover-muted:#93A0B6;
  --good:#4CC489; --good-bg:#11301F; --bad:#FF7B6C; --bad-bg:#3A1A17;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
.num,.amt{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* top band */
.top{background:var(--cover);color:var(--cover-ink);padding:14px 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:.2px}
.brand small{color:var(--cover-muted);font-size:12px;margin-top:3px}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--cover-muted);background:rgba(255,255,255,.07);padding:5px 10px;border-radius:99px}
.sync i{width:8px;height:8px;border-radius:50%;background:#9AA3B2}
.sync.live i{background:#3DDC84;box-shadow:0 0 0 3px rgba(61,220,132,.2)}
.sync.slow i{background:var(--gold)}
.sync.err i{background:#FF6B5B}

main{max-width:880px;margin:0 auto;padding:16px 16px 110px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h3{font-size:18px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* hero */
.hero{background:var(--cover);color:var(--cover-ink);border-radius:16px;padding:18px;display:grid;gap:14px}
.hero .hrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero .k{font-size:13px;color:var(--cover-muted)}
.hero .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.hero .v.good{color:#5BE29F}.hero .v.bad{color:#FF8A7C}
.hero .net{border-top:1px solid rgba(255,255,255,.12);padding-top:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero .net b{font-family:var(--display);font-size:20px;color:var(--gold)}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;text-align:center;box-shadow:var(--shadow)}
.qbtn svg{width:26px;height:26px;color:var(--accent)}
.qbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qbtn.primary svg{color:var(--accent-ink)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--card)}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:22px;font-weight:700}

/* chart */
.chart{display:grid;gap:6px}
.chart .cmax{font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:150px;align-items:end;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 49px,var(--line) 49px,var(--line) 50px)}
.col{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%}
.bar{width:40%;max-width:18px;border-radius:4px 4px 0 0;min-height:2px}
.bar.gave{background:var(--bad)}.bar.got{background:var(--good)}
.clabels{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;font-size:12px;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* lists */
.list{display:flex;flex-direction:column}
.erow,.prow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.list > :last-child{border-bottom:0}
.etype{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.etype svg{width:18px;height:18px}
.etype.gave{background:var(--bad-bg);color:var(--bad)}
.etype.got{background:var(--good-bg);color:var(--good)}
.emain{display:flex;flex-direction:column;min-width:0}
.ename{font-weight:600;overflow-wrap:anywhere}
.esub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.eamt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.eamt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.gave-t{color:var(--bad)}.got-t{color:var(--good)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;background:var(--paper);border:1px solid var(--line);color:var(--accent)}
.chip{display:inline-flex;flex-direction:column;align-items:flex-end;padding:4px 10px;border-radius:10px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip small{font-size:11px;font-weight:600;opacity:.85}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.zero{background:var(--paper);color:var(--muted)}

/* toolbar & buttons */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{flex:1 1 140px;min-width:0}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.red{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.green{background:var(--good);color:#fff;border-color:var(--good)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* party header */
.phead{display:grid;gap:12px}
.phead .top2{display:flex;align-items:center;gap:12px}
.phead h2{font-size:24px}
.bigbal{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;gap:8px;flex-wrap:wrap}
.bigbal.good{background:var(--good-bg);color:var(--good)}
.bigbal.bad{background:var(--bad-bg);color:var(--bad)}
.bigbal.zero{background:var(--paper);color:var(--muted)}
.bigbal b{font-family:var(--display);font-size:26px}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twobtn .btn{padding:13px}
.ledger-h,.lrow{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:center}
.ledger-h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:0 4px 6px;border-bottom:1px solid var(--line)}
.ledger-h span:not(:first-child),.lrow .c{text-align:right}
.lrow{padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.lrow .c{font-weight:700;font-variant-numeric:tabular-nums}
.lrow .run{font-size:12px;color:var(--muted)}

/* proofs */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);padding:0;text-align:left;display:flex;flex-direction:column}
.pthumb{aspect-ratio:3/4;background:var(--paper);display:grid;place-items:center;overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pthumb svg{width:40px;height:40px;color:var(--muted)}
.pmeta{padding:8px 10px;font-size:13px}
.pmeta b{display:block;font-size:14px;overflow-wrap:anywhere}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px 0;border-radius:10px;font-weight:600}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent)}
.tabs button.on svg{transform:translateY(-1px)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.modal{border-radius:18px}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mhead h2{font-size:21px}
.x{border:0;background:var(--paper);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}
.smart{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.smart .srow{display:flex;gap:8px}
.mic{flex:none;width:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.mic svg{width:22px;height:22px;color:var(--accent)}
.mic.on{background:var(--bad);border-color:var(--bad)}
.mic.on svg{color:#fff}
@media (prefers-reduced-motion:no-preference){.mic.on{animation:pulse 1.2s infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(190,50,39,.2)}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px}
.seg label{border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-weight:700;cursor:pointer;display:flex;flex-direction:column}
.seg label small{font-weight:500;color:var(--muted);font-size:12px}
.seg input:focus-visible + label{outline:2px solid var(--accent)}
#t-g:checked + label{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
#t-l:checked + label{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.mfoot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.mfoot .grow{flex:1}
.proofbox{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.proofbox img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.status{font-size:14px;color:var(--muted)}
.status.err{color:var(--bad)}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.rv.off{opacity:.5}
.rv .rtop{display:flex;align-items:center;gap:8px}
.rv .rtop input[type=checkbox]{width:20px;height:20px;flex:none}
.rv .rgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rv input,.rv select{padding:8px 10px}
.bigimg{width:100%;border-radius:12px;border:1px solid var(--line)}
.empty{text-align:center;padding:26px 12px;display:grid;gap:10px;justify-items:center}
.empty svg{width:48px;height:48px;color:var(--gold)}
.banner{padding:10px 12px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-size:14px}
.banner.info{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:90%;box-shadow:var(--shadow)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
@media (max-width:420px){
  .hero .v{font-size:23px}
  .ledger-h,.lrow{grid-template-columns:1fr 74px 74px}
  .rv .rgrid{grid-template-columns:1fr 1fr}
}

body.locked .tabs{display:none}
.login{max-width:420px;margin:24px auto 0;width:100%}
.lockicon{display:grid;place-items:center}
.lockicon svg{width:44px;height:44px;color:var(--accent)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>हिसाब खाता</b><small>Len-den ka live register</small></div>
  <div class="sync" id="sync"><i></i><span>Jud raha hai…</span></div>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="khate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20c-.5-2.6-2-4.4-4-5.1"/></svg>Khate</button>
  <button data-tab="entries"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Entries</button>
  <button data-tab="proofs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 14h8M8 17.5h5"/></svg>Parchiyan</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Backup</button>
</nav>
<div id="modalRoot"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
